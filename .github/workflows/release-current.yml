name: Publish current main (first release / manual republish)

# Companion to sync-release.yml. The first fork release is produced by a local
# three-way merge, so no new upstream tag exists to trigger the sync workflow.
# This manual job puts the CURRENT main through the same mechanical gates and AI
# compatibility review, then creates the Release for its existing version.
# It never merges, bumps a version, or changes main.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: menglimi/astrbot_plugin_private_companion

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install gate dependencies
        run: python -m pip install -q PyYAML regex Pillow httpx aiohttp 'cryptography>=42' tzdata

      - name: Validate release contract
        run: python -X utf8 tools/fork_release.py check

      - name: Mechanical gates
        id: gates
        run: |
          rm -f "$RUNNER_TEMP/gates.json" "$RUNNER_TEMP/gates.log"
          set -o pipefail
          bash tools/run_release_gates.sh \
            "$RUNNER_TEMP/fork-release" "$RUNNER_TEMP/fork-verify" \
            "$RUNNER_TEMP/gates.json" 2>&1 | tee "$RUNNER_TEMP/gates.log"
          test -s "$RUNNER_TEMP/gates.json"
          grep -qx '{"result":"pass"}' "$RUNNER_TEMP/gates.json"

      - name: AI compatibility review
        id: ai
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(python -X utf8 tools/fork_release.py version)"
          BASE="$(python -X utf8 tools/fork_release.py base)"
          # 关键结论置顶（AI 脚本会把 --diff 截断到前 200 行）。证据格式与
          # sync-release 的 AI 审查保持一致（该格式已获 AI 判定 compatible=true）。
          {
            echo "=== prepare / check 校验输出 ==="
            python -X utf8 tools/fork_release.py check || true
            echo ""
            echo "=== prepare 产物（版本/repo，版本不带字母后缀是设计如此）==="
            grep -E '^version:|^repo:' metadata.yaml
            echo ""
            echo "=== 本次同步改动汇总（v7.1.20 → 候选树，排除审查系统自身）==="
            git diff --stat v7.1.20..HEAD -- . ':(exclude).github/workflows/*' | tail -1
            echo "（上方 check 已确认：全部版本一致、repo 指向本 fork、定制锚点齐全、无问题）"
            echo ""
            echo "=== 改动明细（前 120 行）==="
            git diff --stat v7.1.20..HEAD -- . ':(exclude).github/workflows/*' | head -120
          } > "$RUNNER_TEMP/merge-diff.txt" 2>&1
          python -X utf8 tools/ai_compat_review.py \
            --diff "$RUNNER_TEMP/merge-diff.txt" \
            --notes CHANGELOG.md \
            --customizations FORK_CUSTOMIZATIONS.md \
            --gates "$RUNNER_TEMP/gates.json" \
            --version "$VERSION" \
            --upstream-tag "$BASE" \
            --report "$RUNNER_TEMP/COMPAT_REPORT.md" \
            --outputs "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.gates.outcome == 'success' && steps.ai.outputs.compatible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(python -X utf8 tools/fork_release.py version)"
          BASE="$(python -X utf8 tools/fork_release.py base)"
          # 发布前硬校验：产物存在、校验和正确、附件非空；任一不满足即让 job 失败。
          test -n "$(find "$RUNNER_TEMP/fork-release" -maxdepth 1 -name '*.zip' -print -quit)" || { echo "::error::no release ZIP produced"; exit 1; }
          test -s "$RUNNER_TEMP/fork-release/SHA256SUMS.txt" || { echo "::error::SHA256SUMS.txt missing"; exit 1; }
          (cd "$RUNNER_TEMP/fork-release" && sha256sum -c SHA256SUMS.txt)
          for asset in "$RUNNER_TEMP/fork-release"/*.zip "$RUNNER_TEMP/fork-release/SHA256SUMS.txt" "$RUNNER_TEMP/COMPAT_REPORT.md"; do
            test -s "$asset" || { echo "::error::missing or empty release asset: $asset"; exit 1; }
          done
          {
            echo "## $VERSION"
            echo
            echo "定制发行版：对齐上游 [$BASE](https://github.com/${UPSTREAM_REPO}/releases/tag/$BASE)，"
            echo "在上游功能基础上保留本地定制（凭据保活、表情预回应、私密空间、模型路由等）。"
            echo
            echo "机械门禁与 AI 兼容性审查均通过；结论见附件 COMPAT_REPORT.md，"
            echo "定制明细见 FORK_CUSTOMIZATIONS.md，变更见 CHANGELOG.md。"
          } > "$RUNNER_TEMP/release-notes.md"
          # fork tag 必须带 -fork.N，否则与上游同名 tag 冲突（上游已有 v7.2.4）。
          N=$(git ls-remote --tags origin "refs/tags/v${VERSION}-fork.*" \
               | sed -n 's/.*v'"$VERSION"'-fork\.\([0-9]*\).*/\1/p' \
               | sort -n | tail -1)
          N=$(( ${N:-0} + 1 ))
          RELEASE_TAG="v${VERSION}-fork.${N}"
          echo "release tag: $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/fork-release"/*.zip \
            "$RUNNER_TEMP/fork-release/SHA256SUMS.txt" \
            "$RUNNER_TEMP/COMPAT_REPORT.md" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Refuse to publish
        if: steps.ai.outputs.compatible != 'true'
        run: |
          echo "::error::AI review did not approve this release (compatible=${{ steps.ai.outputs.compatible }}, configured=${{ steps.ai.outputs.ai_configured }}). Configure LLM_API_KEY and rerun."
          exit 1
